name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4.1.7

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /html/aiticket
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.test
            tests/**
            writable/**
            spark
            composer.json
            composer.lock
            package.json
            package-lock.json
            README.md
            LICENSE
            .gitignore
            .github/**
